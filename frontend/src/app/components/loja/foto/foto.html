<div class="foto" [class.com-imagem]="endereco() && !falhou">
  <img *ngIf="endereco() && !falhou" [src]="endereco()" [alt]="alt" loading="lazy" (error)="falhou = true" />
  <div *ngIf="!endereco() || falhou" class="notebook {{ linha }}" role="img" [attr.aria-label]="alt">
    <div class="tela"></div>
    <div class="base"></div>
  </div>
</div>
