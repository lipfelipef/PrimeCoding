<div class="painel" *ngIf="painel.usuarioLogado">
  <header class="painel-topo">
    <a routerLink="/painel" class="marca">prime<span>coding</span> <small>painel</small></a>
    <nav>
      <a routerLink="/painel/pedidos" routerLinkActive="ativo">Pedidos</a>
      <a routerLink="/painel/unidades" routerLinkActive="ativo">Unidades</a>
      <a routerLink="/painel/modelos" routerLinkActive="ativo">Modelos</a>
    </nav>
    <div class="painel-conta">
      <a routerLink="/">Ver loja</a>
      <button type="button" class="botao" (click)="painel.sair()">Sair</button>
    </div>
  </header>
  <main class="painel-conteudo">
    <router-outlet></router-outlet>
  </main>
</div>

<main class="entrar" *ngIf="!painel.usuarioLogado">
  <form class="entrar-caixa" (ngSubmit)="entrar()">
    <a routerLink="/" class="marca">prime<span>coding</span></a>
    <h1>Área do revendedor</h1>
    <label class="campo largo">E-mail
      <input name="email" type="email" [(ngModel)]="email" autocomplete="username" />
    </label>
    <label class="campo largo">Senha
      <input name="senha" type="password" [(ngModel)]="senha" autocomplete="current-password" />
    </label>
    <p class="aviso erro" *ngIf="erro" role="alert">{{ erro }}</p>
    <button type="submit" class="botao botao-escuro botao-grande">Entrar</button>
  </form>
</main>
