<div class="barra">
  <div>
    <h1 class="titulo">Modelos</h1>
    <p class="subtitulo">Um modelo por linha. O preço aqui é o de referência; cada unidade tem o seu.</p>
  </div>
</div>
<p class="aviso erro" *ngIf="erro">{{ erro }}</p>
<table class="tabela" *ngIf="list.length > 0">
  <thead>
    <tr><th>Linha</th><th>Modelo</th><th>Preço de referência</th><th>Na loja</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let m of list">
      <td>{{ loja.nomeLinha(m.linha) }}</td>
      <td>{{ loja.nomeCompleto(m) }}</td>
      <td>{{ loja.dinheiro(m.preco) }}</td>
      <td><span class="status {{ m.ativo ? 'DISPONIVEL' : 'CANCELADO' }}">{{ m.ativo ? 'Aparece' : 'Escondido' }}</span></td>
      <td class="acoes"><a [routerLink]="['/painel/modelos', m.id]">Editar</a></td>
    </tr>
  </tbody>
</table>
