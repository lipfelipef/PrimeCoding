server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API fica no container do backend; o site chama /api/...
    location /api/ {
        # foto do modelo enviada pelo painel (o padrão do nginx é 1 MB)
        client_max_body_size 4m;
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rotas do Angular (/notebook/pro, /painel...) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html aponta para os arquivos da versão atual: o navegador confere
    # sempre se mudou, senão continua mostrando o site de antes do deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # main-QKPKJ2QO.js e companhia mudam de nome a cada build, podem ficar guardados
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}