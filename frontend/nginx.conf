server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API fica no container do backend; o site chama /api/...
    location /api/ {
        # foto do modelo enviada pelo painel (o padrão do nginx é 1 MB)
        client_max_body_size 4m;
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rotas do Angular (/notebook/pro, /painel...) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}