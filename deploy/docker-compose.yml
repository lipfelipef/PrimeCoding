services:
  mysql:
    image: mysql:8.4
    container_name: primecoding-mysql
    environment:
      MYSQL_DATABASE: primecoding
      MYSQL_USER: primecoding
      MYSQL_PASSWORD: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_SENHA:?defina MYSQL_ROOT_SENHA no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: primecoding-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/primecoding?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USUARIO: primecoding
      DB_SENHA: ${DB_SENHA}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin}
      LOJA_WHATSAPP: ${LOJA_WHATSAPP:-5511900000000}
      TZ: America/Sao_Paulo
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: primecoding-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Porta 443 com HTTPS; a 80 só redireciona para a 443
  caddy:
    image: caddy:2.10-alpine
    container_name: primecoding-caddy
    environment:
      SITE_DOMINIO: ${SITE_DOMINIO:-localhost}
      SITE_PRINCIPAL: ${SITE_PRINCIPAL:-localhost}
      SITE_WWW: ${SITE_WWW:-www.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mysql-dados:
  caddy-dados:
  caddy-config: