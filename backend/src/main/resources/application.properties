spring.application.name=primecoding
server.port=8080

# Sem variáveis de ambiente roda com H2 em memória; no Docker o compose passa o MySQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:DB_PRIMECODING}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_SENHA:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.web.error.include-message=always

# Senha do revendedor criado na primeira vez que o banco sobe
primecoding.admin.email=${ADMIN_EMAIL:admin@primecoding.com.br}
primecoding.admin.senha=${ADMIN_SENHA:admin}
